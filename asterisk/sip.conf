[general]
context=default
allowoverlap=no
udpbindaddr=0.0.0.0:5060
tcpenable=no
tcpbindaddr=0.0.0.0:5060
transport=udp
srvlookup=yes
useragent=Asterisk PBX
alwaysauthreject=yes
canreinvite=no
insecure=invite,port
directmedia=no
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=g729
allow=g722
musiconhold=default
mohinterpret=default
mohsuggest=default

; Template for internal extensions
[internal-template](!)
type=friend
context=internal
host=dynamic
canreinvite=no
insecure=invite,port
directmedia=no
disallow=all
allow=ulaw,alaw,gsm,g729,g722

; Internal extensions
[100](internal-template)
secret=100123
callerid="Operator" <100>

[101](internal-template)
secret=101123
callerid="Branch Manager" <101>

[102](internal-template)
secret=102123
callerid="Sales Department" <102>

[103](internal-template)
secret=103123
callerid="Support Department" <103>

; Trunk configuration (example)
[trunk-provider]
type=friend
host=your.provider.com
username=your_username
secret=your_password
fromuser=your_username
fromdomain=your.provider.com
insecure=invite,port
context=incoming
canreinvite=no
directmedia=no