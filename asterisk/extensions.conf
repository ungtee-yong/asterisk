[globals]
; Global variables

[general]
; General settings
static=yes
writeprotect=no
clearglobalvars=no

[default]
; Default context - reject all calls
exten => _X.,1,NoOp(Rejecting call to ${EXTEN})
 same => n,Answer()
 same => n,Playback(invalid)
 same => n,Hangup()

[incoming]
; Context for incoming calls
exten => s,1,NoOp(Incoming call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(call_routing.py)
 same => n,Hangup()

; Direct extension routing (fallback)
exten => _1XX,1,NoOp(Direct call to extension ${EXTEN})
 same => n,Answer()
 same => n,Dial(SIP/${EXTEN},30)
 same => n,Voicemail(${EXTEN}@default)
 same => n,Hangup()

[internal]
; Internal extensions context
exten => _1XX,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(SIP/${EXTEN},30)
 same => n,Voicemail(${EXTEN}@default)
 same => n,Hangup()

; Operator extension
exten => 0,1,NoOp(Transfer to operator)
 same => n,Dial(SIP/100,30)
 same => n,Voicemail(100@default)
 same => n,Hangup()