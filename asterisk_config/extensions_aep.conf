; AEP Extensions Configuration สำหรับ Asterisk ที่มีอยู่แล้ว
; เพิ่มส่วนนี้ใน extensions.conf หรือ include ไฟล์นี้

[incoming-aep]
; Context สำหรับ incoming calls ผ่าน AEP
exten => s,1,NoOp(Incoming call from ${CALLERID(num)} via AEP)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AEAP(127.0.0.1:4573,aeap_secret_key_123,call_routing)
 same => n,Hangup()

; Direct extension routing (fallback)
exten => _1XX,1,NoOp(Direct call to extension ${EXTEN})
 same => n,Answer()
 same => n,Dial(SIP/${EXTEN},30)
 same => n,Voicemail(${EXTEN}@default)
 same => n,Hangup()

[aep-callcenter]
; AEP specific context for call center
exten => _X.,1,NoOp(AEP Call Center routing for ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,AEAP(127.0.0.1:4573,aeap_secret_key_123,call_routing)
 same => n,Hangup()

; Test extension สำหรับทดสอบ AEP
exten => 9999,1,NoOp(Test AEP connection)
 same => n,Answer()
 same => n,Playback(demo-thanks)
 same => n,AEAP(127.0.0.1:4573,aeap_secret_key_123,test_connection)
 same => n,Hangup()