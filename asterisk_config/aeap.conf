[general]
; AEP (Asterisk External Protocol) Configuration
; สำหรับ Asterisk ที่มีอยู่แล้ว

; Enable AEP
enabled=yes

; AEP server configuration
bindaddr=0.0.0.0
bindport=4573

; Authentication
secret=aeap_secret_key_123

; Connection settings
timeout=30
keepalive=60

; Logging
debug=yes
verbose=yes

; Security settings - อนุญาตให้ Node.js application เชื่อมต่อ
permit=127.0.0.1/255.255.255.255
permit=10.0.0.0/255.0.0.0
permit=172.16.0.0/255.240.0.0
permit=192.168.0.0/255.255.0.0

; Application settings
max_connections=100
max_channels_per_connection=10

; Call control permissions
allow_originate=yes
allow_dial=yes
allow_hangup=yes
allow_answer=yes
allow_playback=yes
allow_record=yes
allow_speech=yes
allow_agi=yes

; Event filtering
events=all
event_mask=*

; Channel variables to pass
channelvars=CALLERID,DNID,CHANNEL,UNIQUEID,CONTEXT,EXTEN,PRIORITY