# Simple Asterisk Configuration for AEP
# เพิ่มการตั้งค่าเหล่านี้ในไฟล์ config ของ Asterisk ที่มีอยู่แล้ว

# 1. เพิ่มใน aeap.conf
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=4573
secret=aeap_secret_key_123
permit=127.0.0.1/32
permit=192.168.0.0/16
permit=10.0.0.0/8

# 2. เพิ่มใน extensions.conf
[incoming-simple-aep]
; สายโทรเข้าผ่าน AEP
exten => s,1,NoOp(Simple AEP Incoming Call)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AEAP(127.0.0.1:4573,aeap_secret_key_123,call_routing)
 same => n,Hangup()

; สายทดสอบ
exten => 9999,1,NoOp(Simple AEP Test Call)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AEAP(127.0.0.1:4573,aeap_secret_key_123,test_connection)
 same => n,Hangup()

; สายโทรออกไปยังสาขา
exten => _1XX,1,NoOp(Transfer to Branch)
 same => n,Dial(SIP/${EXTEN},30)
 same => n,Hangup()

# 3. เพิ่มใน modules.conf
load => res_aeap.so
load => app_aeap.so

# 4. เพิ่มใน manager.conf
[aeap_manager]
secret=aeap_secret_key_123
permit=127.0.0.1/32
permit=192.168.0.0/16
permit=10.0.0.0/8
read=system,call,log,verbose,agent,user,config,dtmf,reporting,cdr,dialplan
write=system,call,agent,user,config,command,reporting,originate

[nodejs_app]
secret=nodejs_secret_123
permit=127.0.0.1/32
permit=192.168.0.0/16
permit=10.0.0.0/8
read=system,call,log,verbose,agent,user,config,dtmf,reporting,cdr,dialplan
write=system,call,agent,user,config,command,reporting,originate